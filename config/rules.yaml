# Initial classification rules. QA owns this file.
# The tool only proposes a class; the QA reviewer decides.

required_fields:
  - id
  - title
  - site
  - area
  - product
  - batch
  - detected_at
  - detected_by
  - process_step
  - description
  - immediate_actions

# Risk flags the reporter must answer explicitly with true or false.
# A missing, blank or non-boolean answer ("yes", "예", "true" in quotes) is
# rejected — an unanswered question must never be read as "no".
# Every field used as an `equals:` trigger under `classes` must be listed here.
required_flags:
  - cpp_excursion
  - spec_oos
  - other_batches_possibly_affected
  - sterility_assurance_impacted
  - released_product_affected
  - data_integrity_concern
  - patient_safety_impact
  - regulatory_report_required

# ─────────────────────────────────────────────────────────────────────────────
# 분류 제안 규칙 — 사내 deviation 관리 SOP의 등급 정의를 여기에 옮깁니다.
# 수정 방법은 docs/USAGE.md "5. rules.yaml을 SOP에 맞추기" 참고.
# 저장 후 `python -m pytest -q` 와 샘플 실행으로 결과를 확인하십시오.
# ─────────────────────────────────────────────────────────────────────────────

# 근거 SOP 번호와 개정 번호. 초안의 분류(제안) 절에 그대로 표시됩니다.
# 비워 두면 초안에 "분류 기준 출처 미기재"로 표시됩니다.
# ※ 현재 아래 등급 기준은 SOP와 대조되지 않은 예시 값입니다.
sop_reference: ""

# 등급 목록. 반드시 높은(심각한) 등급부터 적습니다.
#   id    : 규칙 안에서 쓰는 이름 (영문 소문자 권장, 바꾸면 classes 의 키도 같이 바꿈)
#   label : 초안·요약표에 표시되는 이름 (SOP 표기 그대로)
levels:
  - id: critical
    label: CRITICAL
  - id: major
    label: MAJOR
  - id: minor
    label: MINOR

# 어떤 트리거에도 해당하지 않을 때 제안할 등급과 그 문구.
default_level: minor
default_reason: "상위 등급 트리거에 해당 없음 (보고자 입력 기준) — 검토자 확인 필요"

# 등급별 트리거. 하나라도 해당하면 그 등급을 제안하고, 위 levels 순서대로 확인합니다.
#   equals: true  → 입력 양식의 예/아니오 항목 (required_flags 에 있어야 함)
#   min: N        → recurrence_count (조회 기간 내 일치하는 과거 deviation 건수) 가 N 이상
# 하위 등급 트리거에 해당한 것도 초안에 "그 밖에 해당한 트리거"로 함께 표시됩니다.
classes:
  critical:
    - field: sterility_assurance_impacted
      equals: true
      reason: "무균 보증에 영향 가능성"
    - field: released_product_affected
      equals: true
      reason: "출하된 제품에 영향 가능성"
    - field: data_integrity_concern
      equals: true
      reason: "데이터 완전성(ALCOA+) 우려"
    - field: patient_safety_impact
      equals: true
      reason: "환자 안전에 영향 가능성"
  major:
    - field: cpp_excursion
      equals: true
      reason: "주요 공정 변수(CPP) 기준 이탈"
    - field: spec_oos
      equals: true
      reason: "규격 이탈(OOS) 결과"
    - field: other_batches_possibly_affected
      equals: true
      reason: "다른 배치 영향 가능성"
    - field: recurrence_count
      min: 2
      reason: "조회 기간 내 동일 사업장·설비·유형 반복 (2회 이상)"

# SOP 기준 중 도구가 평가하지 못하는 것 (수치 기준, 조건 조합 등).
# 초안의 분류 절에 "☐ 검토자가 직접 확인" 항목으로 표시됩니다. 도구는 판단하지 않습니다.
# 예:
#   manual_checks:
#     - clause: "5.5.2"
#       text: "CPP 이탈이 30분 이상 지속되었는가 — 해당하면 중대"
manual_checks: []

# 이력 CSV의 final_class 로 허용할 값 중 levels 에 없는 것 (SOP 개정 전 등급명 등).
# 여기 없는 값은 --check-history 에서 경고합니다. 표시만 하고 분류 제안에는 쓰지 않습니다.
# 예: history_class_labels: [A, B, C]

# 반복성 조회.
#   window_days : 오늘(--today) 기준 며칠 전까지 볼지
#   match_on    : 모두 같아야 "같은 건"으로 봄. equipment_id / category / site 중에서 선택.
#                 site 를 넣으면 다른 사업장의 같은 설비 ID 건은 제외됩니다.
#   show_root_cause : 반복 건 표에 과거 건의 근본원인(당시 기록)을 표시할지.
#                     기본 false — 과거 원인을 그대로 옮겨 쓰는 것을 막기 위함.
#                     true 로 바꿔도 도구는 원인 연관성을 판단하지 않습니다.
recurrence:
  window_days: 365
  match_on: [site, equipment_id, category]
  show_root_cause: false

categories:
  - equipment
  - environmental_monitoring
  - documentation
  - process_parameter
  - material
  - personnel
  - utilities

# Ishikawa (6M) prompts used to build the investigation plan.
ishikawa:
  Man: "작업자 교육 이력, 해당 SOP 숙지 여부, 교대 인수인계"
  Machine: "설비 정비·교정 이력, 알람 로그, 최근 변경"
  Method: "SOP 버전, 배치 기록서 지시 내용과 실제 수행 비교"
  Material: "원자재·소모품 lot, 입고 시험 결과, 보관 조건"
  Measurement: "계측기 교정 상태, 분석법, 샘플링 위치·시점"
  Milieu: "환경 모니터링 결과, 차압·온습도 추이, 유틸리티 상태"
