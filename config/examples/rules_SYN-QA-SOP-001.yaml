# ─────────────────────────────────────────────────────────────────────────────
# 예시: 합성 SOP data/synthetic/sop/SYN-QA-SOP-001.md 를 rules.yaml 로 옮긴 결과.
# 실제 SOP가 아닙니다. "SOP → rules.yaml" 절차와 결과를 확인하기 위한 예시입니다.
#
#   python -m devdraft.cli data/synthetic/intake/*.yaml --summary --today 2026-11-24 \
#       --rules config/examples/rules_SYN-QA-SOP-001.yaml --out /tmp/sop_example
#
# 조항 추적: SOP의 모든 조항 번호가 이 파일 어딘가에 나와야 합니다
# (반영 → reason 끝의 "(SOP x.y.z)", 미반영 → 아래 "미반영 조항" 주석).
# tests/test_devdraft.py::test_example_sop_every_clause_is_traced 가 이를 검사합니다.
#
# 미반영 조항 (트리거로 표현할 수 없음 → manual_checks 로 초안에 검토자 확인 항목으로 표시):
#   5.5.2  CPP 이탈 30분 이상 지속 시 중대 — 입력 양식에 지속 시간 수치 칸이 없음.
#          parameters.duration 은 자유 기재 문자열이라 기준 비교에 쓰지 않음(설명 문장에서
#          수치를 뽑아내는 방식은 쓰지 않음). 반영하려면 입력 양식에 수치 항목 추가 필요.
# 맥락 조항 (분류 트리거 아님):
#   5.1    등급 체계와 확정 주체 → levels, 초안의 "QA 검토자 확정 등급" 란
#   5.4.1  기본 등급 → default_level / default_reason
#   6.1    반복성 조회 범위, 과거 근본원인 간주 금지 → recurrence, show_root_cause: false
# ─────────────────────────────────────────────────────────────────────────────

required_fields:
  - id
  - title
  - site
  - area
  - product
  - batch
  - detected_at
  - detected_by
  - process_step
  - description
  - immediate_actions

required_flags:
  - cpp_excursion
  - spec_oos
  - other_batches_possibly_affected
  - sterility_assurance_impacted
  - released_product_affected
  - data_integrity_concern

sop_reference: "SYN-QA-SOP-001 Rev.01 §5 (합성 예시 — 실제 SOP 아님)"

# SOP 5.1
levels:
  - id: critical
    label: "중대 (Critical)"
  - id: major
    label: "주요 (Major)"
  - id: minor
    label: "경미 (Minor)"

# SOP 5.4.1
default_level: minor
default_reason: "5.2·5.3 어디에도 해당 없음 (보고자 입력 기준) — 검토자 확인 필요 (SOP 5.4.1)"

classes:
  critical:
    - field: sterility_assurance_impacted
      equals: true
      reason: "무균 보증에 영향을 줄 가능성 (SOP 5.2.1)"
    - field: released_product_affected
      equals: true
      reason: "출하된 제품에 영향을 줄 가능성 (SOP 5.2.2)"
    - field: data_integrity_concern
      equals: true
      reason: "데이터 완전성(ALCOA+) 우려 (SOP 5.2.3)"
    - field: recurrence_count
      min: 5
      reason: "최근 2년 동일 사업장·설비·유형 5회 이상 — 반복에 따른 상향 (SOP 5.5.1)"
  major:
    - field: cpp_excursion
      equals: true
      reason: "CPP 허용 범위 이탈 (SOP 5.3.1)"
    - field: spec_oos
      equals: true
      reason: "규격 이탈(OOS) 결과 확인 (SOP 5.3.2)"
    - field: other_batches_possibly_affected
      equals: true
      reason: "다른 배치 영향 가능성 (SOP 5.3.3)"
    - field: recurrence_count
      min: 3
      reason: "최근 2년 동일 사업장·설비·유형 3회 이상 (SOP 5.3.4)"

# 도구가 평가하지 않는 SOP 조항. 초안의 분류 절에 체크박스로 표시되어 검토자가 직접 확인합니다.
manual_checks:
  - clause: "5.5.2"
    text: "CPP 이탈이 30분 이상 지속되었는가 — 해당하면 중대 (관련 공정 변수 표의 비고와 원 기록으로 확인)"

# SOP 5.3.4 / 5.5.1 / 6.1
recurrence:
  window_days: 730
  match_on: [site, equipment_id, category]
  show_root_cause: false

categories:
  - equipment
  - environmental_monitoring
  - documentation
  - process_parameter
  - material
  - personnel
  - utilities

ishikawa:
  Man: "작업자 교육 이력, 해당 SOP 숙지 여부, 교대 인수인계"
  Machine: "설비 정비·교정 이력, 알람 로그, 최근 변경"
  Method: "SOP 버전, 배치 기록서 지시 내용과 실제 수행 비교"
  Material: "원자재·소모품 lot, 입고 시험 결과, 보관 조건"
  Measurement: "계측기 교정 상태, 분석법, 샘플링 위치·시점"
  Milieu: "환경 모니터링 결과, 차압·온습도 추이, 유틸리티 상태"
